{% extends 'base.html' %}

{% block title %}Register - FinAura AI Financial Advisor{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-6 col-lg-5">
        <div class="glass-card p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="brand-icon mx-auto mb-3" style="width: 54px; height: 54px; font-size: 1.5rem;">
                    <i class="fa-solid fa-user-plus"></i>
                </div>
                <h3 class="fw-bold mb-1">Create Your Account</h3>
                <p class="text-muted small">Begin AI-driven financial discipline and intelligent budgeting</p>
            </div>

            <form action="{{ url_for('auth.register') }}" method="POST">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label text-muted small fw-bold">Username</label>
                        <input type="text" name="username" class="form-control form-control-custom" placeholder="alex_investor" required autofocus>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label text-muted small fw-bold">Email</label>
                        <input type="email" name="email" class="form-control form-control-custom" placeholder="alex@example.com" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label text-muted small fw-bold">Password</label>
                        <input type="password" name="password" class="form-control form-control-custom" placeholder="Minimum 6 characters" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label text-muted small fw-bold">Confirm Password</label>
                        <input type="password" name="confirm_password" class="form-control form-control-custom" placeholder="Repeat password" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label text-muted small fw-bold">Preferred Currency</label>
                        <select name="currency" class="form-select form-select-custom">
                            <option value="$">$ (USD)</option>
                            <option value="₹">₹ (INR)</option>
                            <option value="€">€ (EUR)</option>
                            <option value="£">£ (GBP)</option>
                            <option value="C$">C$ (CAD)</option>
                            <option value="A$">A$ (AUD)</option>
                            <option value="AED">AED (Dirham)</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-4">
                        <label class="form-label text-muted small fw-bold">Monthly Inflow Target</label>
                        <input type="number" step="100" min="0" name="monthly_income_target" class="form-control form-control-custom" placeholder="5000">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary-custom w-100 justify-content-center py-2 mb-3">
                    <i class="fa-solid fa-rocket me-2"></i> Launch Financial Assistant
                </button>
            </form>

            <div class="text-center mt-3 pt-3 border-top border-secondary border-opacity-10">
                <p class="text-muted small mb-0">Already registered? <a href="{{ url_for('auth.login') }}" class="text-primary fw-bold">Log in here</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
